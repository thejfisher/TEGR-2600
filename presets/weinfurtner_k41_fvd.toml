[system]
name = "Weinfurtner K-41 False Vacuum Decay"
num_particles = 2
max_particles = 100
dt = 0.001
total_ticks = 20000

[grid]
# Grid maps to the 127.5 um (L = 500ξ) homonuclear Potassium-41 box trap
grid_resolution = 64
wave_speed = 6.079  # Corresponds to 6.079 mm/s Potassium-41 sound speed
wave_decay = 0.95
# High grid noise simulates the n=50 dimensionless density (Bogoliubov fluctuations)
warm_grid_noise = 0.50 
periodic_boundaries = true

[damping]
vacuum_enabled = true
# Vacuum damping naturally pre-thermalizes the noisy grid, bypassing MCMC
vacuum_damping = 0.007

[torsion]
torsion_coupling = 1.0

[pauli]
pauli_enabled = true
pauli_strength = 10.0
pauli_power = 3

[rae]
rae_mode = false

[pilot]
pilot_wave = false
pilot_wave_coupling = 0.0

[kuramoto]
# Kuramoto disabled for scalar nucleation (FVD) tests
kuramoto_enabled = false
kuramoto_k = 0.0

[output]
output_dir = "./output_k41_fvd"
save_trajectories = true

[particles]
# Two nucleating "bubble" perturbations injected into the center of the trap
mass = [1.0, 1.0]
position_x = [-1.0, 1.0]
position_y = [0.0, 0.0]
position_z = [0.0, 0.0]
velocity_x = [0.0, 0.0]
velocity_y = [0.0, 0.0]
velocity_z = [0.0, 0.0]
phase = [0.0, 0.0]
spin = [0.5, 0.5]
