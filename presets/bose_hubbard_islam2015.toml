# Islam et al. 2015 (Nature) - Ground State Equilibrium
# "Measuring entanglement entropy through the interference of quantum many-body twins"
# 4 Rb-87 atoms, GROUND STATE at each U/J
# Sweep U/J from 1 → 20 to map entanglement crossover
#
# VALIDATION TARGET:
#   - S2(half-chain) peaks at U/J ≈ 1-3 (superfluid regime)
#   - S2(half-chain) → 0 at U/J ≈ 10+ (Mott insulator)
#   - Single-site purity = 1.0 in Mott limit
#   - S2(subsystem) > S2(full) in superfluid = entanglement witness
#
# USAGE: Run this preset, then manually vary U (Pauli) in the GUI
#        from 1→20 while keeping J (Torsion) = 1.0
#        Record S2(half-chain) at each U/J value

[system]
name = "Islam 2015 - Ground State (U/J sweep)"
num_particles = 4

[particles]
# Rb-87 atoms
mass = [1.0, 1.0, 1.0, 1.0]
mass_unit = "sim"
position_x = [0.0, 680.0, 1360.0, 2040.0]
position_y = [0.0, 0.0, 0.0, 0.0]
position_z = [0.0, 0.0, 0.0, 0.0]
position_unit = "nm"
# GROUND STATE: zero phases, zero momentum — static equilibrium
phase = [0.0, 0.0, 0.0, 0.0]
velocity_x = [0.1, 0.1, 0.1, 0.1]
spin = [0.5, 0.5, 0.5, 0.5]

[coupling]
# Start at U/J = 10 (Mott), adjust in GUI for sweep
pauli_strength = 10.0
torsion_coupling = 1.0
vacuum_damping = 0.007

[entanglement]
adjacency = [[0,1], [1,2], [2,3]]

[integration]
dt = 0.001
total_ticks = 10000
grid_resolution = 64
wave_speed = 65.0
wave_decay = 0.9999

[output]
save_trajectories = true
save_plots = true
plot_format = "png"
