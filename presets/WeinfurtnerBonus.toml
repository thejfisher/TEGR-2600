[system]
name = "Weinfurtner Bonus: Giant Quantum Vortex (QNMs)"
num_particles = 2
max_particles = 100
dt = 0.001
total_ticks = 40000

[grid]
# Grid maps to the Superfluid Helium-4 container
grid_resolution = 64
wave_speed = 10.0   # Analogous to the surface wave speed
wave_decay = 0.995  # Very low decay to allow the "ringing" to persist
warm_grid_noise = 0.01
periodic_boundaries = true

[damping]
vacuum_enabled = true
# Light damping so the Quasinormal Modes (QNMs) can ring out slowly
vacuum_damping = 0.001 

[torsion]
# CRITICAL: Massive frame-dragging to simulate the Vortex Circulation (C)
torsion_coupling = 50.0 

[pauli]
# Simulates the hard inner core of the vortex
pauli_enabled = true
pauli_strength = 20.0
pauli_power = 3

[rae]
rae_mode = false

[pilot]
pilot_wave = false
pilot_wave_coupling = 0.0

[kuramoto]
kuramoto_enabled = false
kuramoto_k = 0.0

[output]
output_dir = "./output_bonus_vortex"
save_trajectories = true

[particles]
# Particle 0: The Giant Quantum Vortex (Massive, Central, Max Spin)
# Particle 1: The incoming wave perturbation (Light, off-center, moving inward)
mass = [100.0, 1.0]
position_x = [0.0, 20.0]
position_y = [0.0, 5.0]
position_z = [0.0, 0.0]
velocity_x = [0.0, -5.0]
velocity_y = [0.0, 0.0]
velocity_z = [0.0, 0.0]
phase = [0.0, 0.0]
# High spin on Particle 0 drives the rotating spacetime (Kerr analogue)
spin = [1.0, 0.0]
