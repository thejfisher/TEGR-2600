[system]
name = "Weinfurtner Rb Entanglement Harvesting"
# The 2 particles act as the Unruh-DeWitt detectors (Laser Pulses)
num_particles = 2
max_particles = 100
dt = 0.001
# 20,000 ticks simulates the T = 3ms strict interaction window
total_ticks = 20000

[grid]
# Grid maps to the Oblate Rubidium BEC
grid_resolution = 64
wave_speed = 8.0  # Corresponds to 8.0 mm/s Rubidium sound speed
wave_decay = 0.99 # Low decay to allow topological wakes to propagate
warm_grid_noise = 0.05
periodic_boundaries = true

[damping]
vacuum_enabled = true
vacuum_damping = 0.007

[torsion]
torsion_coupling = 1.0

[pauli]
pauli_enabled = true
pauli_strength = 10.0
pauli_power = 3

[rae]
rae_mode = false

[pilot]
pilot_wave = false
pilot_wave_coupling = 0.0

[kuramoto]
# CRITICAL: Kuramoto synchronization enabled to allow Entanglement Harvesting via the grid
kuramoto_enabled = true
kuramoto_k = 50.0

[output]
output_dir = "./output_rb_entanglement"
save_trajectories = true

[particles]
# Probes placed at strict spacelike separation (Δx >= 4cT + 2σ)
# Initialized completely out-of-phase (0 and Pi) to watch them sync/entangle
mass = [1.0, 1.0]
position_x = [-10.0, 10.0]
position_y = [0.0, 0.0]
position_z = [0.0, 0.0]
velocity_x = [0.0, 0.0]
velocity_y = [0.0, 0.0]
velocity_z = [0.0, 0.0]
phase = [0.0, 3.14159]
spin = [0.5, 0.5]
